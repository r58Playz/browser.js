<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>sbxdiff click geometry probe</title>
	</head>
	<body style="margin: 0">
		<div style="height: 40px"></div>
		<script>
			// What coordinates does a synthesized click carry, in a CROSS-ORIGIN
			// frame?
			//
			// Measured on rateyourmusic, oracle against sandbox in the Turnstile
			// widget's realm: MouseEvent.screenX/screenY were 22,32 against
			// 214,336 -- and 22,32 is exactly what --sbxdiff-click passed. Where a
			// click lands on a checkbox is precisely what a challenge asks, so it
			// is worth knowing whether that is the sandbox being wrong, the oracle
			// being wrong, or the runner delivering the click to a different
			// widget on each side.
			//
			// 127.0.0.1 against localhost is a different SITE, so in the oracle
			// this frame is out-of-process and --sbxdiff-click-frame targets ITS
			// widget; under the proxy everything is same-origin and one renderer,
			// so the click goes to the main frame's. That is the difference this
			// probe is built to expose.
			const say = (k, v) => {
				document.title = k + "=" + String(v);
			};
			addEventListener("message", (e) => {
				if (!e.data || !e.data.sbxClick) return;
				for (const [k, v] of Object.entries(e.data.sbxClick))
					say("geo." + k, v);
			});
			const f = document.createElement("iframe");
			f.src = "http://127.0.0.1:4510/clickframe.html";
			f.style.cssText =
				"position:absolute;left:60px;top:80px;width:300px;height:200px;border:0";
			document.body.appendChild(f);
		</script>
	</body>
</html>

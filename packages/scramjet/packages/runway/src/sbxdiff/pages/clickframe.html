<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>click frame</title>
	</head>
	<body style="margin: 0">
		<div id="t" style="width: 300px; height: 200px; background: #0a0"></div>
		<script>
			// Reports every coordinate space a click carries, so the one that
			// diverges can be named rather than guessed at.
			addEventListener("click", (e) => {
				parent.postMessage(
					{
						sbxClick: {
							screenX: e.screenX,
							screenY: e.screenY,
							clientX: e.clientX,
							clientY: e.clientY,
							pageX: e.pageX,
							pageY: e.pageY,
							isTrusted: e.isTrusted,
							// Where this frame believes it is, which is what turns a
							// client coordinate into a screen one.
							winScreenX: window.screenX,
							winScreenY: window.screenY,
						},
					},
					"*"
				);
			});
		</script>
	</body>
</html>

<!doctype html>
<html
	lang="en"
	id="page_home"
	class="rym page_home scope_music nonsubscriber logged-out"
>
	<head>
		<link rel="preconnect" href="//cdn.sonemic.net" />
		<meta charset="utf-8" />
		<title>sbxdiff doctype probe</title>
	</head>
	<body>
		<div id="filler" style="height: 400px">x</div>
		<script>
			// Standards mode or quirks mode.
			//
			// `document.compatMode` is one string, and everything about layout hangs
			// off it. Measured on rateyourmusic: the oracle reported "CSS1Compat" and
			// the sandbox "BackCompat", which took `documentElement.clientHeight` from
			// 813 to 15364 and moved `scrollHeight`, `HTMLCollection.length` and
			// `IntersectionObserverEntry.isIntersecting` with it -- all of which an
			// anti-bot payload records.
			//
			// The shape here copies rateyourmusic's own opening on purpose: the DOCTYPE,
			// then a newline, then `<html>` with attributes, then a head whose first
			// content is whitespace and a <link>. Anything a rewriter inserts BEFORE the
			// DOCTYPE puts the parser in quirks mode, and where it chooses to inject
			// depends on what the head starts with.
			const say = (k, v) => {
				document.title = k + "=" + String(v);
			};
			say("doc.compatMode", document.compatMode);
			say("doc.doctype", document.doctype ? document.doctype.name : "none");
			say(
				"doc.firstChildType",
				document.firstChild ? document.firstChild.nodeType : "none"
			);
			say(
				"doc.firstChildName",
				document.firstChild ? document.firstChild.nodeName : "none"
			);
			say("doc.documentElementTag", document.documentElement.tagName);
			say("doc.htmlLang", document.documentElement.lang);
			say("doc.htmlClass", document.documentElement.className);
			say("doc.clientHeight", document.documentElement.clientHeight);
			say("doc.scrollHeight", document.documentElement.scrollHeight);
			say(
				"doc.headFirstChild",
				document.head.firstChild ? document.head.firstChild.nodeName : "none"
			);
			say("doc.bodyChildCount", document.body.children.length);
		</script>
	</body>
</html>

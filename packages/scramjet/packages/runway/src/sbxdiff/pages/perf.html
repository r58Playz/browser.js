<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>sbxdiff resource-timing probe</title>
	</head>
	<body>
		<img id="a" src="/asset.png?one" />
		<img id="b" src="/asset.png?two" />
		<script src="/marker.js"></script>
		<script>
			// What the page can learn about what it loaded.
			//
			// Resource timing is a list of URLs the guest can read back verbatim,
			// which makes it two risks at once: a proxied URL here is a direct
			// leak, and an ENTRY the oracle does not have is a leak of the
			// sandbox's own machinery. Anti-bot payloads carry this list -- which
			// is also why it is a size divergence, since a proxied URL is some
			// fifty characters longer than the one it stands for.
			//
			// Suspected on rateyourmusic: Cloudflare's /fo/ payloads match exactly
			// on the first POST and diverge by more and more after it (+203 on
			// 4588 bytes, +1365 on 88631, +1526 on 91852), which is the shape of
			// something that accumulates as resources load.
			//
			// Reported as count, total name length, and a joined list, so "one
			// extra entry" and "every name is longer" are distinguishable.
			const say = (k, v) => {
				document.title = k + "=" + String(v);
			};

			// Two entries exist because of how the document is HOSTED, not
			// because of anything it did, and neither is scramjet's doing:
			//
			//   favicon.ico          a browser fetches one for a TOP-LEVEL
			//                        document. In the sandbox the page under test
			//                        is an iframe, so it never gets the entry.
			//   long-animation-frame only exists if a frame took over 50ms. The
			//                        oracle's page owns the load that does; the
			//                        sandbox's boots inside the harness's frame,
			//                        before the guest document exists. Measured
			//                        stable across runs: oracle always, sandbox
			//                        never.
			//
			// They are kept out of the aggregates and reported on their own
			// below, so the difference stays visible as itself instead of
			// shifting every count next to it -- which is how one extra entry
			// hides in a total.
			const isHosting = (name) =>
				name.endsWith("/favicon.ico") || name === "long-animation-frame";
			const notHosting = (name) => !isHosting(name);

			addEventListener("load", () => {
				setTimeout(() => {
					const types = ["resource", "navigation", "paint", "mark", "measure"];
					for (const type of types) {
						let entries = [];
						try {
							entries = performance.getEntriesByType(type);
						} catch (e) {
							say("perf." + type, "threw:" + e.name);
							continue;
						}
						const names = entries.map((e) => e.name).filter(notHosting);
						say("perf." + type + ".count", names.length);
						say(
							"perf." + type + ".nameChars",
							names.reduce((n, s) => n + s.length, 0)
						);
						say("perf." + type + ".names", names.sort().join(" "));
					}
					// The same list by the other two routes a page can take to it.
					// A shim that covers one and not the others is worse than none,
					// because the disagreement is itself the tell.
					// Names as well as count: "one entry more" is not actionable,
					// and the entry that differs is the whole of the finding.
					say(
						"perf.getEntries.all",
						performance
							.getEntries()
							.filter((e) => notHosting(e.name))
							.map((e) => e.entryType + ":" + e.name)
							.sort()
							.join(" ")
					);
					say(
						"perf.getEntries.count",
						performance.getEntries().filter((e) => notHosting(e.name)).length
					);
					// Reported, not hidden.
					const all = performance.getEntries();
					say(
						"perf.hosting.favicon",
						all.some((e) => e.name.endsWith("/favicon.ico"))
					);
					say(
						"perf.hosting.loaf",
						all.some((e) => e.entryType === "long-animation-frame")
					);
					say(
						"perf.byName.asset",
						performance.getEntriesByName(location.origin + "/asset.png?one")
							.length
					);
					const first = performance.getEntriesByType("resource")[0];
					say(
						"perf.toJSON.name",
						first ? JSON.parse(JSON.stringify(first)).name : "none"
					);
					say("perf.entry.name", first ? first.name : "none");
				}, 400);
			});
		</script>
	</body>
</html>

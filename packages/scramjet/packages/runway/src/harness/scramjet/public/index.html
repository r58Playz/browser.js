<!doctype html>
<html>
	<head>
		<title>Scramjet Test Harness</title>
		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>
		<script src="/sbxdiff-transport.js"></script>
		<script src="/sbxdiff-live-transport.js"></script>
		<!--
			libcurl and the wisp transport are loaded on demand, from the
			non-sbxdiff branch of init(), not here.

			Loading libcurl costs 128 crypto.getRandomValues draws at module
			init. Under the oracle's deterministic PRNG the keystream counter is
			shared by every realm on a thread, so those draws shift every value
			the guest page afterwards sees -- and the guest page is the thing
			being compared. It is not used at all on the store-backed path.
		--></head>
	<body>
		<h1>Scramjet Test Harness</h1>
		<div id="status">Initializing...</div>
		<button id="reload-btn" style="display: none; margin: 8px 0">
			🔄 Reload Test
		</button>
		<iframe
			id="testframe"
			style="width: 100%; height: 80vh; border: 1px solid #ccc"
		></iframe>

		<script>
			const statusEl = document.getElementById("status");
			const testframe = document.getElementById("testframe");
			const reloadBtn = document.getElementById("reload-btn");
			const { Controller } = $scramjetController;

			const loadScript = (src) =>
				new Promise((resolve, reject) => {
					const el = document.createElement("script");
					el.src = src;
					el.onload = resolve;
					el.onerror = () => reject(new Error(`failed to load ${src}`));
					document.head.appendChild(el);
				});

			let controller;
			let scramjetFrame;

			async function init() {
				statusEl.textContent = "Registering service worker...";

				const registration = await navigator.serviceWorker.register("/sw.js");

				// Wait for the service worker to be ready
				if (!navigator.serviceWorker.controller) {
					statusEl.textContent = "Waiting for service worker to activate...";
					await new Promise((resolve) => {
						if (registration.active) {
							resolve();
							return;
						}
						const sw = registration.installing || registration.waiting;
						if (sw) {
							sw.addEventListener("statechange", () => {
								if (sw.state === "activated") resolve();
							});
						}
					});
					// Wait for controller
					if (!navigator.serviceWorker.controller) {
						await new Promise((resolve) => {
							navigator.serviceWorker.addEventListener(
								"controllerchange",
								resolve,
								{ once: true }
							);
						});
					}
				}

				statusEl.textContent = "Initializing controller...";

				// sbxdiff: serve every upstream request from a recorded store
				// instead of the live internet. Opt-in via ?sbxdiffStore, so the
				// normal runway path is untouched.
				//
				// This also removes the wisp WebSocket, which is what deadlocks
				// virtual time: kDeterministicLoading pauses the clock while a
				// load is outstanding, and the wisp transport needs timers to
				// make progress, so the load waits on the timer and the timer
				// waits on the clock.
				let transport;
				// Port only, for the same reason as the base64 hash: a full
				// encoded endpoint URL embedded the target origin in this URL.
				const sbxdiffStore = new URLSearchParams(location.search).get(
					"sbxdiffStore"
				);
				// ?sbxdiffLive fetches for real through Node instead of replaying
				// a store -- same seam, no wisp and no in-page TLS. A diagnostic,
				// never a differ input.
				const sbxdiffLive = new URLSearchParams(location.search).get(
					"sbxdiffLive"
				);
				if (sbxdiffLive) {
					transport = new SbxdiffLiveTransport({
						endpoint: `http://localhost:${sbxdiffLive}/__sbxdiff/live`,
					});
					window.__sbxdiffTransport = transport;
				} else if (sbxdiffStore) {
					transport = new SbxdiffTransport({
						endpoint: `http://localhost:${sbxdiffStore}/__sbxdiff/fetch`,
					});
					window.__sbxdiffTransport = transport;
				} else {
					await loadScript("/libcurl/index.js");
					await loadScript("/runway-cleartext-https-transport.js");
					const innerTransport = new window.LibcurlTransport.LibcurlClient({
						wisp: "ws://localhost:4501/",
					});
					transport = new RunwayCleartextHttpsTransport(innerTransport);
				}

				const sw = navigator.serviceWorker.controller ?? registration.active;
				if (!sw) {
					throw new Error("No service worker available for controller");
				}

				controller = new Controller({
					serviceworker: sw,
					transport,
				});
				window.__runwayController = controller;

				await controller.ready;

				scramjetFrame = controller.createFrame(testframe);
				window.__runwayScramjetFrame = scramjetFrame;

				statusEl.textContent = "Ready - waiting for test...";

				window.__runwayNavigate = (url) => {
					statusEl.textContent = `Loading test: ${url}`;
					// Store the URL for reload support.
					//
					// Skipped for a hash-driven (sbxdiff) run: the hash already
					// carries the target, and a storage write holds a
					// WebScopedVirtualTimePauser until the browser process acks
					// it. Under kDeterministicLoading that pauser stops virtual
					// time, and its ack lands on a queue the pause has fenced --
					// so the clock never restarts. Same shape as
					// crbug.com/1455267.
					if (location.hash.length <= 1) {
						sessionStorage.setItem("__runway_last_test", url);
					}
					reloadBtn.style.display = "inline-block";
					// injectTestFunctions();
					console.log("navigating to", url);
					scramjetFrame.go(url);
				};

				window.__runwayGetProxiedUrl = (url) => {
					return $scramjet.rewriteUrl(url, scramjetFrame.context, {
						origin: new URL(location.href),
						base: new URL(location.href),
					});
				};

				window.__runwayReload = () => {
					const lastTest = sessionStorage.getItem("__runway_last_test");
					if (lastTest) {
						window.__runwayNavigate(lastTest);
					}
				};

				reloadBtn.addEventListener("click", window.__runwayReload);

				// sbxdiff: drive from the URL so a run needs no CDP session.
				// Takes precedence over the sessionStorage reload path, and
				// suppresses it, so a traced run is not also replaying the
				// previous test.
				if (location.hash.length > 1) {
					// b64: keeps the target out of this page's own URL --
					// --sbxdiff-virtual-time-after matches a URL substring, and an
					// embedded copy made THIS page match as the guest realm,
					// enabling virtual time during bootstrap.
					const h = location.hash.slice(1);
					window.__runwayNavigate(
						h.startsWith("b64:") ? atob(h.slice(4)) : decodeURIComponent(h)
					);
					console.log("Harness ready, driven by location.hash");

					return;
				}

				// Auto-navigate to last test on reload
				const lastTest = sessionStorage.getItem("__runway_last_test");
				if (lastTest) {
					console.log("Reloading last test:", lastTest);
					window.__runwayNavigate(lastTest);
				}

				console.log("Harness ready, __runwayNavigate exposed");
			}

			init().catch((err) => {
				statusEl.textContent = `Error: ${err.message}`;
				console.error("Harness init error:", err);
			});
		</script>
	</body>
</html>
